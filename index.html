<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Livro</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background: #f4f4f4; margin: 0; }
    main { max-width: 480px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    h1 { font-size: 1.4rem; margin-top: 0; }
    label { display: block; margin: 12px 0 4px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { margin-top: 16px; padding: 10px 24px; background: #1a5fb4; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #14487f; }
  </style>
</head>
<body>
  <main>
    <h1>Cadastro de Livro</h1>
    <form id="form-livro">
      <label for="titulo">Título</label>
      <input type="text" id="titulo" name="titulo" placeholder="Informe o título do livro" required>

      <label for="autor">Autor</label>
      <input type="text" id="autor" name="autor" placeholder="Informe o autor do livro" required>

      <button type="submit" id="btn-salvar">Gravar</button>
    </form>
  </main>
</body>
</html>
